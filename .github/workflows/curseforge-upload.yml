name: Upload existing release to CurseForge
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: curseforge-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/check
        id: check
        with:
          tag: ${{ inputs.tag }}
      - name: Upload (check dashboard before rerunning)
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.check.outputs.archive }}
          RELEASE_NOTES: ${{ steps.check.outputs.notes }}
        run: |
          python3 tools/upload_curseforge.py --archive "$RELEASE_ARCHIVE" \
            --notes "$RELEASE_NOTES" --tag "$RELEASE_TAG"
